<script>
// ──────────────────────────────────────────
// State
// ──────────────────────────────────────────
let currentUser = null;
let novels = [];
let currentNovelId = null;
let currentChapterIdx = 0;
let selectedGenre = '恋愛';
let selectedTone = '純文学風・美しい描写';
let characters = [];
let genResult = '';
let saveTimer = null;
let appConfig = JSON.parse(localStorage.getItem('novel_app_config') || '{}');

const GENRE_COLORS = { '恋愛':'#f472b6','ファンタジー':'#c084fc','ミステリー':'#60a5fa','SF':'#06b6d4','ホラー':'#ef4444','青春':'#fb923c','歴史':'#a3e635','日常':'#94a3b8' };

// ──────────────────────────────────────────
// Auth
// ──────────────────────────────────────────
window.addEventListener('load', () => {
  const { auth, onAuthStateChanged } = window._fb;
  onAuthStateChanged(auth, user => {
    if (user) {
      currentUser = user;
      showApp(user);
    } else {
      currentUser = null;
      document.getElementById('landing').style.display = 'flex';
      document.getElementById('app-shell').style.display = 'none';
    }
  });
});

async function signInGoogle() {
  const { auth, signInWithPopup, provider } = window._fb;
  try { await signInWithPopup(auth, provider); }
  catch(e) { alert('ログインに失敗しました: ' + e.message); }
}

async function doSignOut() {
  const { auth, signOut } = window._fb;
  await signOut(auth);
}

function showApp(user) {
  document.getElementById('landing').style.display = 'none';
  document.getElementById('app-shell').style.display = 'flex';
  const av = document.getElementById('user-avatar');
  if (user.photoURL) { av.src = user.photoURL; av.style.display = 'block'; }
  document.getElementById('user-name').textContent = user.displayName || user.email;
  loadNovels();
  loadSettings();
}

// ──────────────────────────────────────────
// Firestore helpers
// ──────────────────────────────────────────
function novelsRef() {
  const { db, collection } = window._fb;
  return collection(db, 'users', currentUser.uid, 'novels');
}

async function loadNovels() {
  const { getDocs, query, orderBy } = window._fb;
  try {
    const snap = await getDocs(query(novelsRef(), orderBy('updatedAt', 'desc')));
    novels = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderNovelList();
  } catch(e) { console.error(e); }
}

async function saveNovel(novel) {
  const { db, doc, setDoc, serverTimestamp } = window._fb;
  const ref = doc(db, 'users', currentUser.uid, 'novels', novel.id);
  const data = { ...novel, updatedAt: serverTimestamp() };
  delete data.id;
  await setDoc(ref, data);
}

async function deleteNovelFromDB(id) {
  const { db, doc, deleteDoc } = window._fb;
  await deleteDoc(doc(db, 'users', currentUser.uid, 'novels', id));
}

// ──────────────────────────────────────────
// Novel list
// ──────────────────────────────────────────
function renderNovelList() {
  const list = document.getElementById('novel-list');
  if (!novels.length) {
    list.innerHTML = '<div style="padding:16px;color:#334155;font-size:12px;text-align:center">まだ作品がありません</div>';
    return;
  }
  list.innerHTML = novels.map(n => {
    const c = GENRE_COLORS[n.genre] || '#7c3aed';
    const chars = (n.chapters || []).reduce((s, ch) => s + (ch.text?.length || 0), 0);
    return `<div class="novel-item ${n.id === currentNovelId ? 'active' : ''}" onclick="openNovel('${n.id}')">
      <div class="novel-item-title">${esc(n.title || '無題')}</div>
      <div class="novel-item-meta" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <span style="background:${c}18;color:${c};border:1px solid ${c}33;padding:1px 6px;border-radius:10px;font-size:10px">${n.genre}</span>
        <span>${chars.toLocaleString()}字</span>
      </div>
    </div>`;
  }).join('');
}

function openNovel(id) {
  currentNovelId = id;
  currentChapterIdx = 0;
  renderNovelList();
  showTab('write');
}

function currentNovel() { return novels.find(n => n.id === currentNovelId); }

function scheduleSave(novel) {
  clearTimeout(saveTimer);
  setSaveStatus('saving');
  saveTimer = setTimeout(async () => {
    await saveNovel(novel);
    const idx = novels.findIndex(n => n.id === novel.id);
    if (idx >= 0) novels[idx] = novel;
    renderNovelList();
    setSaveStatus('saved');
    setTimeout(() => setSaveStatus(''), 2000);
  }, 1200);
}

function setSaveStatus(s) {
  const el = document.getElementById('save-status');
  if (!el) return;
  el.className = 'save-indicator' + (s ? ' ' + s : '');
  el.textContent = s === 'saving' ? '保存中...' : s === 'saved' ? '✓ 保存済み' : '';
}

// ──────────────────────────────────────────
// Tabs
// ──────────────────────────────────────────
function showTab(tab) {
  ['write','export','settings'].forEach(t => document.getElementById('tab-'+t)?.classList.toggle('active', t === tab));
  const mc = document.getElementById('main-content');
  if (tab === 'settings') { renderSettings(mc); return; }
  if (tab === 'export') { renderExport(mc); return; }
  // write
  if (!currentNovelId) {
    mc.innerHTML = '<div class="empty-main">📖<span>左の「＋ 新しい物語」から始めましょう</span></div>';
  } else {
    renderWritePage(mc);
  }
}

// ──────────────────────────────────────────
// Setup page
// ──────────────────────────────────────────
function startSetup() {
  currentNovelId = null;
  characters = [];
  selectedGenre = '恋愛';
  selectedTone = '純文学風・美しい描写';
  renderNovelList();
  const mc = document.getElementById('main-content');
  mc.innerHTML = `
  <div class="setup-page">
    <div class="page-title">📖 新しい物語を始める</div>

    <div class="card">
      <div class="card-title">📌 基本設定</div>
      <div class="form-row">
        <div class="form-group form-full">
          <label class="form-label">タイトル</label>
          <input class="form-input" id="s-title" placeholder="例: 月明かりの誓い" />
        </div>
        <div class="form-group form-full">
          <label class="form-label">ジャンル</label>
          <div class="tag-row" id="genre-row">
            ${['恋愛','ファンタジー','ミステリー','SF','ホラー','青春','歴史','日常'].map(g =>
              `<button class="tag-btn ${g==='恋愛'?'sel':''}" data-g="${g}" onclick="selGenre(this)">${g}</button>`
            ).join('')}
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">舞台・世界観</label>
          <input class="form-input" id="s-world" placeholder="例: 現代の東京、中世ファンタジー" />
        </div>
        <div class="form-group">
          <label class="form-label">文体</label>
          <div class="tag-row">
            ${[['純文学風・美しい描写','🌸 純文学'],['ライトノベル風・テンポよく','⚡ ラノベ'],['大衆小説風・読みやすく','📚 大衆'],['詩的・幻想的な文体','✨ 詩的']].map(([v,l]) =>
              `<button class="tag-btn ${v===selectedTone?'sel':''}" data-t="${v}" onclick="selTone(this)">${l}</button>`
            ).join('')}
          </div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">あらすじ・物語の方向性</label>
        <textarea class="form-input form-textarea" id="s-synopsis" rows="4" placeholder="例: 記憶を失った少女が自分の過去を探す旅に出る。途中で出会う青年との関係が軸となる。"></textarea>
      </div>
    </div>

    <div class="card">
      <div class="card-title">👥 登場人物</div>
      <div class="char-grid" id="char-grid"></div>
      <button class="add-char-btn" onclick="addChar()">＋ 登場人物を追加</button>
    </div>

    <div class="card">
      <div class="card-title">📋 章立て（任意）</div>
      <textarea class="form-input form-textarea" id="s-chapters" rows="4" placeholder="例:&#10;第1章 出会い&#10;第2章 謎の手紙&#10;&#10;空白でもOK。あとから追加できます"></textarea>
    </div>

    <button class="start-btn" onclick="createNovel()">✨ 執筆を始める</button>
  </div>`;

  addChar('主人公', '主人公の名前・性格・特徴');
  addChar('ヒロイン/ライバル', '相手役の名前・性格・特徴');
}

function selGenre(btn) {
  document.querySelectorAll('[data-g]').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  selectedGenre = btn.dataset.g;
}
function selTone(btn) {
  document.querySelectorAll('[data-t]').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  selectedTone = btn.dataset.t;
}

function addChar(role = '登場人物', placeholder = '名前・性格・特徴') {
  const id = 'c' + Date.now();
  characters.push({ id, role, name: '', desc: '' });
  const grid = document.getElementById('char-grid');
  if (!grid) return;
  const div = document.createElement('div');
  div.className = 'char-card'; div.id = id;
  div.innerHTML = `<button class="char-del" onclick="removeChar('${id}')">✕</button>
    <div class="char-role-lbl">${role}</div>
    <input class="char-name-in" placeholder="名前" oninput="updChar('${id}','name',this.value)" />
    <textarea class="char-desc-in" placeholder="${placeholder}" rows="3" oninput="updChar('${id}','desc',this.value)"></textarea>`;
  grid.appendChild(div);
}

function updChar(id, f, v) { const c = characters.find(c => c.id===id); if(c) c[f]=v; }
function removeChar(id) { characters = characters.filter(c => c.id!==id); document.getElementById(id)?.remove(); }

async function createNovel() {
  const title = document.getElementById('s-title')?.value?.trim() || '無題の物語';
  const synopsis = document.getElementById('s-synopsis')?.value?.trim() || '';
  const world = document.getElementById('s-world')?.value?.trim() || '';
  const chapLines = (document.getElementById('s-chapters')?.value?.trim() || '').split('\n').filter(l => l.trim());
  const chapters = chapLines.length
    ? chapLines.map((l, i) => ({ id: i+1, title: l.trim(), text: '' }))
    : [{ id: 1, title: '第1章', text: '' }];

  const novel = {
    id: 'novel-' + Date.now(),
    title, synopsis, world,
    genre: selectedGenre,
    tone: selectedTone,
    characters: characters.filter(c => c.name || c.desc),
    chapters,
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString(),
  };

  novels.unshift(novel);
  await saveNovel(novel);
  currentNovelId = novel.id;
  currentChapterIdx = 0;
  renderNovelList();
  showTab('write');
}

// ──────────────────────────────────────────
// Write page
// ──────────────────────────────────────────
function renderWritePage(mc) {
  const novel = currentNovel();
  if (!novel) { mc.innerHTML = '<div class="empty-main">📖<span>作品を選択してください</span></div>'; return; }
  const ch = novel.chapters[currentChapterIdx];

  mc.innerHTML = `
  <div class="write-page">
    <div class="write-header">
      <div class="write-title">${esc(novel.title)}</div>
      <span class="save-indicator" id="save-status"></span>
    </div>

    <div class="chapter-tabs">
      ${novel.chapters.map((c, i) => `<button class="ch-tab ${i===currentChapterIdx?'active':''}" onclick="switchCh(${i})">${esc(c.title)}</button>`).join('')}
      <button class="add-ch-btn" onclick="addChapter()">＋</button>
    </div>

    <div class="chapter-card">
      <div class="ch-title-bar">
        <span style="font-size:11px;color:#475569">第${currentChapterIdx+1}章</span>
        <input class="ch-title-in" value="${esc(ch.title)}" oninput="updateChTitle(this.value)" />
        <button class="ch-del-btn" onclick="delChapter()">🗑️</button>
      </div>
      <div class="ch-stats">${(ch.text||'').length.toLocaleString()} 文字</div>
      <textarea class="novel-textarea" id="novel-ta" oninput="updateChText(this.value)" placeholder="ここに物語を書いてください…">${esc(ch.text||'')}</textarea>
    </div>

    <div class="ai-panel">
      <div class="ai-panel-title">🤖 AI執筆アシスト</div>
      <input class="direction-in" id="direction-in" placeholder="AIへの指示（例: 二人の感動的な再会シーン / 空白でも可）" />
      <div class="ai-btns">
        <button class="ai-btn btn-write" id="btn-w" onclick="aiGen('write')">✨ 続きを書く</button>
        <button class="ai-btn btn-cont" id="btn-c" onclick="aiGen('continue')">➡️ さらに続ける</button>
        <button class="ai-btn btn-fix" id="btn-f" onclick="aiGen('rephrase')">🔄 書き直す</button>
      </div>
    </div>
    <div id="gen-area"></div>
  </div>`;
}

function switchCh(i) { currentChapterIdx = i; showTab('write'); }

function updateChTitle(v) {
  const novel = currentNovel(); if(!novel) return;
  novel.chapters[currentChapterIdx].title = v;
  scheduleSave(novel);
  document.querySelectorAll('.ch-tab')[currentChapterIdx].textContent = v;
}

function updateChText(v) {
  const novel = currentNovel(); if(!novel) return;
  novel.chapters[currentChapterIdx].text = v;
  scheduleSave(novel);
  document.querySelector('.ch-stats').textContent = v.length.toLocaleString() + ' 文字';
}

function addChapter() {
  const novel = currentNovel(); if(!novel) return;
  novel.chapters.push({ id: novel.chapters.length+1, title: `第${novel.chapters.length+1}章`, text: '' });
  currentChapterIdx = novel.chapters.length - 1;
  scheduleSave(novel);
  showTab('write');
}

function delChapter() {
  const novel = currentNovel(); if(!novel || novel.chapters.length<=1) { alert('最低1章必要です'); return; }
  if(!confirm('この章を削除しますか？')) return;
  novel.chapters.splice(currentChapterIdx, 1);
  if(currentChapterIdx >= novel.chapters.length) currentChapterIdx = novel.chapters.length-1;
  scheduleSave(novel);
  showTab('write');
}

// ──────────────────────────────────────────
// AI Generation
// ──────────────────────────────────────────
async function aiGen(mode) {
  if(!appConfig.geminiKey) { alert('APIキーを設定してください（⚙️設定）'); showTab('settings'); return; }
  const novel = currentNovel(); if(!novel) return;
  const ch = novel.chapters[currentChapterIdx];
  const direction = document.getElementById('direction-in')?.value?.trim() || '';
  const text = ch.text || '';
  const length = appConfig.genLength || '1000';

  ['btn-w','btn-c','btn-f'].forEach(id => { const b = document.getElementById(id); if(b) b.disabled=true; });
  document.getElementById('gen-area').innerHTML = `<div class="loading-row"><div class="spinner"></div>AIが執筆中...</div>`;

  const charDesc = (novel.characters||[]).map(c=>`・${c.name||'名無し'}（${c.role}）: ${c.desc}`).join('\n');

  let prompt = '';
  if(mode==='write') {
    prompt = `以下の設定の小説${text?'の続き':'の冒頭'}を書いてください。

【タイトル】${novel.title}　【ジャンル】${novel.genre}　【文体】${novel.tone}
【舞台】${novel.world||'未設定'}
【あらすじ】${novel.synopsis||'未設定'}
【登場人物】\n${charDesc||'未設定'}
【現在の章】${ch.title}
${text?`【これまでの文章（末尾）】\n${text.slice(-500)}`:''}
${direction?`【指示】${direction}`:''}

約${length}文字で、${novel.tone}で書いてください。`;
  } else if(mode==='continue') {
    prompt = `以下の小説の続きを書いてください。
【タイトル】${novel.title}　【ジャンル】${novel.genre}　【文体】${novel.tone}
【直前の文章】\n${text.slice(-600)}
${direction?`【方向性】${direction}`:''}
約${length}文字で続きを書いてください。`;
  } else {
    prompt = `以下の小説の文章をより良く書き直してください。
【ジャンル】${novel.genre}　【文体】${novel.tone}
【書き直す文章】\n${text.slice(-500)}
${direction?`【改善点】${direction}`:'描写を豊かに、感情を深く表現してください'}
約${length}文字で書き直してください。`;
  }

  try {
    const model = appConfig.geminiModel || 'gemini-1.5-flash';
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${appConfig.geminiKey}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.9, maxOutputTokens: 2048 } }),
    });
    if(!res.ok) { const e=await res.json(); throw new Error(e.error?.message||'API Error'); }
    const data = await res.json();
    genResult = data.candidates[0].content.parts[0].text;

    document.getElementById('gen-area').innerHTML = `
      <div class="gen-box">
        <div style="font-size:11px;color:#475569;margin-bottom:10px">生成テキスト（${genResult.length}文字）</div>
        <div class="gen-text">${esc(genResult)}</div>
        <div class="gen-actions">
          <button class="adopt-btn" onclick="adoptGen('append')">✅ 末尾に追加</button>
          <button class="replace-btn" onclick="adoptGen('replace')">🔄 全文置換</button>
          <button class="discard-btn" onclick="document.getElementById('gen-area').innerHTML=''">✕ 破棄</button>
        </div>
      </div>`;
  } catch(e) {
    document.getElementById('gen-area').innerHTML = `<div style="color:#ef4444;padding:12px;font-size:13px">❌ ${esc(e.message)}</div>`;
  } finally {
    ['btn-w','btn-c','btn-f'].forEach(id => { const b=document.getElementById(id); if(b) b.disabled=false; });
  }
}

function adoptGen(mode) {
  const novel = currentNovel(); if(!novel||!genResult) return;
  const ch = novel.chapters[currentChapterIdx];
  ch.text = mode==='append' ? (ch.text||'') + (ch.text?'\n\n':'') + genResult : genResult;
  scheduleSave(novel);
  document.getElementById('gen-area').innerHTML = '';
  const ta = document.getElementById('novel-ta');
  if(ta) { ta.value = ch.text; document.querySelector('.ch-stats').textContent = ch.text.length.toLocaleString() + ' 文字'; }
}

// ──────────────────────────────────────────
// Export
// ──────────────────────────────────────────
function renderExport(mc) {
  const novel = currentNovel();
  if(!novel) { mc.innerHTML = '<div class="empty-main">📖<span>作品を選択してください</span></div>'; return; }
  const full = buildText(novel);
  const totalChars = full.length;
  mc.innerHTML = `
  <div class="export-page">
    <div class="page-title">📤 書き出し — ${esc(novel.title)}</div>
    <div class="export-preview">${esc(full.slice(0,2000))}${full.length>2000?'\n\n...(以下省略)':''}</div>
    <div class="export-btns">
      <button class="exp-btn exp-txt" onclick="exportTxt()">📄 テキストでダウンロード</button>
      <button class="exp-btn exp-html" onclick="exportHtml()">🌐 HTMLでダウンロード（公開用）</button>
    </div>
    <div class="export-stats">文字数: <strong style="color:#c084fc">${totalChars.toLocaleString()}</strong> 文字　/　章数: <strong style="color:#c084fc">${novel.chapters.length}</strong> 章　/　ジャンル: ${novel.genre}</div>
  </div>`;
}

function buildText(novel) {
  const h = `${novel.title}\n${'─'.repeat(40)}\nジャンル: ${novel.genre}\nあらすじ: ${novel.synopsis||''}\n\n`;
  return h + novel.chapters.map(ch => `【${ch.title}】\n\n${ch.text||'（未執筆）'}`).join('\n\n' + '─'.repeat(20) + '\n\n');
}

function exportTxt() {
  const novel = currentNovel(); if(!novel) return;
  const b = new Blob([buildText(novel)], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(b); a.download=novel.title+'.txt'; a.click();
}

function exportHtml() {
  const novel = currentNovel(); if(!novel) return;
  const body = novel.chapters.map(ch =>
    `<section><h2>${escH(ch.title)}</h2>${(ch.text||'').split('\n').map(l=>l?`<p>${escH(l)}</p>`:'<br>').join('')}</section>`
  ).join('<hr>');
  const html = `<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>${escH(novel.title)}</title>
<style>body{font-family:'Hiragino Mincho ProN','Yu Mincho',serif;max-width:700px;margin:60px auto;padding:0 24px;background:#fdfaf6;color:#1a1a1a;line-height:2.2}h1{text-align:center;font-size:28px;margin-bottom:8px}.meta{text-align:center;color:#888;font-size:13px;margin-bottom:60px}h2{font-size:20px;border-bottom:1px solid #ddd;padding-bottom:8px;margin:40px 0 20px}p{text-indent:1em;margin:0}hr{border:none;border-top:1px solid #eee;margin:40px 0}</style>
</head><body><h1>${escH(novel.title)}</h1><div class="meta">${escH(novel.genre)}</div>${body}</body></html>`;
  const b = new Blob([html], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(b); a.download=novel.title+'.html'; a.click();
}

// ──────────────────────────────────────────
// Settings
// ──────────────────────────────────────────
function loadSettings() { appConfig = JSON.parse(localStorage.getItem('novel_app_config')||'{}'); }

function renderSettings(mc) {
  mc.innerHTML = `
  <div class="settings-page">
    <div class="page-title">⚙️ 設定</div>
    <div class="settings-card">
      <div class="settings-title">🔑 Gemini APIキー</div>
      <div class="form-group">
        <label class="form-label">Google Gemini APIキー</label>
        <input type="password" class="form-input" id="set-key" value="${appConfig.geminiKey||''}" placeholder="AIzaSy..." />
        <div style="font-size:11px;color:#334155;margin-top:4px">aistudio.google.com → APIキーを取得（無料）</div>
      </div>
      <div class="form-group">
        <label class="form-label">モデル</label>
        <select class="form-input" id="set-model">
          <option value="gemini-2.0-flash" ${appConfig.geminiModel==='gemini-2.0-flash'?'selected':''}>gemini-2.0-flash（最新）</option>
          <option value="gemini-1.5-pro" ${appConfig.geminiModel==='gemini-1.5-pro'?'selected':''}>gemini-1.5-pro（高品質）</option>
          <option value="gemini-1.5-flash" ${(!appConfig.geminiModel||appConfig.geminiModel==='gemini-1.5-flash')?'selected':''}>gemini-1.5-flash（安定・推奨）</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">1回の生成文字数</label>
        <select class="form-input" id="set-len">
          <option value="500" ${appConfig.genLength==='500'?'selected':''}>短め（約500文字）</option>
          <option value="1000" ${(!appConfig.genLength||appConfig.genLength==='1000')?'selected':''}>標準（約1000文字）</option>
          <option value="2000" ${appConfig.genLength==='2000'?'selected':''}>長め（約2000文字）</option>
        </select>
      </div>
    </div>
    <button class="save-set-btn" onclick="saveSettings()">💾 保存</button>
    <div id="set-saved" style="display:none;margin-top:10px;color:#10b981;font-size:13px">✓ 保存しました</div>
  </div>`;
}

function saveSettings() {
  appConfig = {
    geminiKey: document.getElementById('set-key').value.trim(),
    geminiModel: document.getElementById('set-model').value,
    genLength: document.getElementById('set-len').value,
  };
  localStorage.setItem('novel_app_config', JSON.stringify(appConfig));
  const m = document.getElementById('set-saved');
  if(m) { m.style.display='block'; setTimeout(()=>m.style.display='none', 2000); }
}

// ──────────────────────────────────────────
// Helpers
// ──────────────────────────────────────────
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }
function escH(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
